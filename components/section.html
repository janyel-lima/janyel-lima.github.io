     @keydown.escape.window="closeCert()"
     @fullscreenchange.window="
       if (!document.fullscreenElement) {
         certModal.fullscreen = false;
         $nextTick(() => window.lucide && lucide.createIcons());
       }
     ">

  <!-- ── Outer frame ──────────────────────────── -->
  <div class="rpg-card relative bg-black/70"
       style="clip-path: polygon(0 0, 100% 0, 100% 96%, 92% 100%, 0 100%)">

    <!-- ══ HEADER ══════════════════════════════ -->
    <div class="relative flex items-center justify-between
                px-5 py-3 border-b border-white/20
                bg-gradient-to-r from-primary/8 via-transparent to-transparent">

      <div class="flex items-center gap-3">
        <div class="relative flex items-center justify-center w-9 h-9 bg-primary/10
                    shadow-[0_0_14px_rgba(var(--color-primary-rgb),0.30)]"
             style="clip-path:polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%)">
          <i data-lucide="graduation-cap" class="w-5 h-5 text-primary"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 bg-primary rotate-45 shadow-[0_0_6px_var(--color-primary)]"></div>
            <span class="text-[length:var(--text-base)] font-black uppercase tracking-[0.12em] text-primary"
                  x-text="$store.i18n.t('edu_archive_title')">
            </span>
          </div>
          <span class="text-[length:var(--text-xs)] text-primary/40 uppercase tracking-[0.2em]"
                x-text="$store.i18n.t('edu_knowledge_loaded')">
          </span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden sm:flex flex-col items-end gap-0.5">
          <span class="text-[length:var(--text-xs)] text-primary/45 uppercase tracking-[0.1em]"
                x-text="$store.i18n.t('edu_node_id')"></span>
          <span class="text-[length:var(--text-sm)] text-primary/60 font-black tracking-[0.1em]"
                x-text="$store.i18n.t('edu_node_code')"></span>
        </div>
      </div>
    </div>

    <!-- ══ BODY ════════════════════════════════ -->
    <div class="relative p-5 space-y-3">

      <style>
        @keyframes eduScan { from { left: -48px } to { left: 110% } }
        @keyframes secScan { from { left: -64px } to { left: 110% } }

        /*
          Chevron fix:
          The rotation and transition live on the WRAPPER div (.edu-chev),
          not on the <i> / <svg> that Lucide replaces — so the class
          binding always survives icon re-renders.
        */
        .edu-chev {
          display: flex;
          align-items: center;
          justify-content: center;
          transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .edu-chev.is-open { transform: rotate(180deg); }

        .edu-item-wrap { transition: max-height 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease; }
        .edu-sec-body  { transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1), opacity 0.32s ease; }
      </style>

      <!-- SECTION LOOP -->
      <template x-for="(items, section) in educationLogs" :key="section">

        <!-- ══ SECTION WRAPPER ══ -->
        <div x-data="{ secOpen: true }"
             x-init="$nextTick(() => window.lucide && lucide.createIcons())"
             class="relative">

          <!-- ── SECTION HEADER ────────────────────────── -->
          <div class="relative flex items-center gap-3 mb-0 cursor-pointer select-none group/sec
                      px-1 py-2 rounded-sm transition-colors duration-200"
               @click="secOpen = !secOpen; $nextTick(() => window.lucide && lucide.createIcons())">

            <!-- Section icon -->
            <div class="flex-shrink-0 w-9 h-9 flex items-center justify-center
                        transition-all duration-300"
                 :class="secOpen
                   ? 'bg-primary/15 shadow-[0_0_12px_rgba(var(--color-primary-rgb),0.25)]'
                   : 'bg-primary/8'"
                 style="clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%)">
              <template x-if="section === 'higher'">
                <i data-lucide="landmark" class="w-5 h-5 text-primary"></i>
              </template>
              <template x-if="section === 'courses'">
                <i data-lucide="library" class="w-5 h-5 text-primary"></i>
              </template>
              <template x-if="section === 'languages'">
                <i data-lucide="languages" class="w-5 h-5 text-primary"></i>
              </template>
            </div>

            <!-- Label -->
            <span class="text-[length:var(--text-ms)] font-black uppercase tracking-[0.18em] transition-colors duration-200"
                  :class="secOpen ? 'text-primary' : 'text-primary/50'"
                  x-text="$store.i18n.t(
                    section === 'higher'    ? 'higher_education' :
                    section === 'languages' ? 'edu_languages'    : 'courses'
                  )">
            </span>

            <!-- Counter badge -->
            <div class="flex items-center justify-center h-5 px-2 transition-all duration-200"
                 :class="secOpen
                   ? 'bg-primary/15 shadow-[0_0_6px_rgba(var(--color-primary-rgb),0.2)]'
                   : 'bg-primary/5'">
              <span class="text-[10px] font-black tracking-[0.1em]"
                    :class="secOpen ? 'text-primary' : 'text-primary/40'"
                    x-text="items.length">
              </span>
            </div>

            <!-- Divider line -->
            <div class="flex-1 relative h-px overflow-hidden">
              <div class="absolute inset-0 transition-opacity duration-300"
                   :class="secOpen
                     ? 'bg-gradient-to-r from-primary/30 to-transparent opacity-100'
                     : 'bg-gradient-to-r from-primary/10 to-transparent opacity-60'">
              </div>
              <div class="absolute top-0 bottom-0 w-16 bg-gradient-to-r from-transparent via-primary/60 to-transparent"
                   :class="secOpen ? 'animate-[secScan_0.7s_ease-out_forwards]' : ''"
                   style="left:-64px">
              </div>
            </div>

            <!--
              ★ SECTION CHEVRON — wrapper carries the rotation,
                icon just carries the color.
            -->
            <div class="flex-shrink-0 transition-all duration-300"
                 :class="secOpen
                   ? 'bg-primary/12 shadow-[0_0_10px_rgba(var(--color-primary-rgb),0.2)]'
                   : 'bg-primary/5'"
                 style="clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);
                        width:1.75rem; height:1.75rem;">
              <!-- rotation wrapper -->
              <div class="edu-chev w-full h-full"
                   :class="secOpen ? 'is-open' : ''">
                <i data-lucide="chevron-down"
                   class="w-3.5 h-3.5 transition-colors duration-200"
                   :class="secOpen ? 'text-primary' : 'text-primary/30'">
                </i>
              </div>
            </div>

          </div>
          <!-- ── END SECTION HEADER ─────────────────────── -->

          <!-- ── SECTION BODY — collapses ────────────────── -->
          <div class="edu-sec-body overflow-hidden"
               :style="secOpen ? 'max-height:2000px; opacity:1' : 'max-height:0; opacity:0'">

            <!-- ITEM LOOP -->
            <div class="space-y-2 pl-1 pt-3">
              <template x-for="(item, idx) in items" :key="item.title_key">

                <div class="edu-item relative border border-white/5 bg-black/30
                            transition-all duration-300"
                     x-data="{ open: false }"
                     :class="open
                       ? 'border-primary/20 bg-black/50 shadow-[inset_0_0_20px_rgba(var(--color-primary-rgb),0.04)]'
                       : 'border-primary/6'"
                     style="clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)">

                  <!-- Active bar left -->
                  <div class="absolute left-0 top-0 w-[2px] bg-primary shadow-[0_0_8px_var(--color-primary)]
                              pointer-events-none transition-all duration-500"
                       :style="open ? 'height:100%' : 'height:0'">
                  </div>

                  <!-- Sweep layer -->
                  <div class="edu-sweep absolute inset-y-0 w-16 pointer-events-none
                              bg-gradient-to-r from-transparent via-primary/12 to-transparent -translate-x-full">
                  </div>

                  <!-- ── ITEM HEADER ROW ── -->
                  <div class="relative flex items-center gap-4 px-4 py-3.5 cursor-pointer select-none"
                       @click="open = !open; $nextTick(() => window.lucide && lucide.createIcons())">

                    <!-- Icon badge -->
                    <div class="flex-shrink-0 flex items-center justify-center w-10 h-10
                                transition-all duration-300"
                         :class="open
                           ? 'bg-primary/15 shadow-[0_0_14px_rgba(var(--color-primary-rgb),0.3)]'
                           : 'bg-primary/8'"
                         style="clip-path:polygon(15% 0,85% 0,100% 15%,100% 85%,85% 100%,15% 100%,0 85%,0 15%)">
                      <i :data-lucide="item.icon || 'book-open'"
                         class="w-4.5 h-4.5 transition-colors duration-300"
                         :class="open ? 'text-primary' : 'text-primary/55'">
                      </i>
                    </div>

                    <!-- Title + Provider -->
                    <div class="flex-1 min-w-0 flex flex-col gap-1">
                      <div class="text-[length:var(--text-md)] font-black uppercase tracking-[0.1em] leading-tight
                                  flex items-center gap-2 transition-colors duration-200"
                           :class="open ? 'text-primary' : 'text-primary/75'">
                        <template x-if="item.flag">
                          <span class="leading-none" x-text="item.flag"></span>
                        </template>
                        <span x-text="$store.i18n.t(item.title_key)"></span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <i data-lucide="shield-check"
                           class="w-3 h-3 flex-shrink-0 transition-colors duration-200"
                           :class="open ? 'text-primary/55' : 'text-primary/30'">
                        </i>
                        <span class="text-[length:var(--text-md)] text-primary/30 tracking-[0.08em] transition-colors duration-200"
                              :class="open ? '!text-primary/45' : ''"
                              x-text="$store.i18n.t(item.provider_key)">
                        </span>
                      </div>
                    </div>

                    <!-- Right area: mini-peek + chevron -->
                    <div class="flex-shrink-0 flex items-center gap-2">

                      <!-- Mini indicators (only when closed) -->
                      <div class="flex items-center gap-1.5 overflow-hidden transition-all duration-200"
                           :style="open ? 'max-width:0;opacity:0;margin:0' : 'max-width:96px;opacity:1'">
                        <template x-if="item.hours">
                          <span class="text-[10px] font-black text-primary/25 tracking-[0.08em] uppercase whitespace-nowrap"
                                x-text="item.hours + $store.i18n.t('edu_hours_unit')">
                          </span>
                        </template>
                        <template x-if="item.cert">
                          <div class="w-1.5 h-1.5 bg-primary/30 rotate-45 flex-shrink-0"></div>
                        </template>
                        <template x-if="item.proficiency">
                          <div class="flex items-end gap-[2px] flex-shrink-0">
                            <template x-for="i in 5" :key="i">
                              <div :class="i <= item.proficiency ? 'bg-primary/45' : 'bg-primary/10'"
                                   :style="`height:${3 + i * 1.5}px`"
                                   class="w-[3px]">
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>

                      <!--
                        ★ ITEM CHEVRON — same fix: wrapper rotates, icon colours.
                      -->
                      <div class="flex-shrink-0 transition-all duration-300"
                           :class="open
                             ? 'bg-primary/12 shadow-[0_0_8px_rgba(var(--color-primary-rgb),0.2)]'
                             : 'bg-primary/5'"
                           style="clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);
                                  width:1.5rem; height:1.5rem;">
                        <!-- rotation wrapper -->
                        <div class="edu-chev w-full h-full"
                             :class="open ? 'is-open' : ''">
                          <i data-lucide="chevron-down"
                             class="w-3 h-3 transition-colors duration-200"
                             :class="open ? 'text-primary' : 'text-primary/30'">
                          </i>
                        </div>
                      </div>

                    </div>
                  </div>
                  <!-- ── END ITEM HEADER ROW ── -->

                  <!-- ── ITEM EXPANDED PANEL ── -->
                  <div class="edu-item-wrap overflow-hidden"
                       :style="open ? 'max-height:120px; opacity:1' : 'max-height:0; opacity:0'">

                    <!-- Scan separator -->
                    <div class="relative mx-4 h-px overflow-hidden"
                         style="transition:opacity 0.15s ease 0.08s"
                         :style="open ? 'opacity:1' : 'opacity:0'">
                      <div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
                      <div class="absolute top-0 bottom-0 w-12 bg-gradient-to-r from-transparent via-primary/60 to-transparent"
                           :class="open ? 'animate-[eduScan_0.55s_ease-out_0.05s_forwards]' : ''"
                           style="left:-48px">
                      </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center flex-shrink-0 gap-1.5 px-4 py-3 flex-wrap">

  <!-- Proficiency badge — signal strength: sky blue nos bars ativos -->
  <template x-if="item.proficiency">
    <div class="group/prof flex items-center gap-2 h-8 px-2.5 bg-black/50
                border border-sky-500/20
                hover:border-sky-400/60 hover:bg-sky-950/40
                hover:shadow-[0_0_14px_rgba(125,211,252,0.18)]
                transition-all duration-200 cursor-default">
      <div class="flex items-end gap-[3px]">
        <template x-for="i in 5" :key="i">
          <div :class="i <= item.proficiency
                        ? 'bg-sky-400 group-hover/prof:shadow-[0_0_8px_rgba(125,211,252,0.8)]'
                        : 'bg-sky-900/50'"
               :style="`height:${6 + i * 2}px`"
               class="w-1.5 transition-all duration-200">
          </div>
        </template>
      </div>
      <span class="text-[length:var(--text-xs)] font-black tracking-[0.1em] uppercase
                   text-sky-400/70 group-hover/prof:text-sky-300
                   transition-colors duration-200"
            x-text="$store.i18n.t(item.proficiency_key)">
      </span>
    </div>
  </template>

  <!-- Hours badge — relógio: ponteiros giram, laranja quente -->
  <template x-if="item.hours">
    <div class="group/hrs flex items-center gap-1.5 h-8 px-2.5 bg-black/50
                border border-amber-500/15
                hover:border-amber-400/60 hover:bg-amber-950/35
                hover:shadow-[0_0_14px_rgba(251,191,36,0.15)]
                transition-all duration-200 cursor-default">
      <i data-lucide="clock"
         class="w-3 h-3 text-amber-500/50
                group-hover/hrs:text-amber-300
                group-hover/hrs:rotate-[30deg]
                transition-all duration-300">
      </i>
      <span class="text-[length:var(--text-xs)] font-black tracking-[0.1em] uppercase
                   text-amber-500/55 group-hover/hrs:text-amber-300
                   transition-colors duration-200"
            x-text="item.hours + $store.i18n.t('edu_hours_unit')">
      </span>
    </div>
  </template>

  <!-- Cert button — lacre/selo: violet, badge cresce -->
  <template x-if="item.cert">
    <button @click.stop="openCert(item.cert)"
            class="group/cert flex items-center gap-1.5 h-8 px-3 bg-black/50
                   border border-violet-500/15
                   text-[length:var(--text-xs)] font-black uppercase tracking-[0.1em]
                   text-violet-400/55
                   hover:border-violet-400/70 hover:text-violet-300 hover:bg-violet-950/40
                   hover:shadow-[0_0_16px_rgba(56,189,248,0.2)]
                   transition-all duration-200">
      <i data-lucide="file-badge"
         class="w-3.5 h-3.5
                group-hover/cert:scale-110 group-hover/cert:drop-shadow-[0_0_4px_rgba(56,189,248,0.7)]
                transition-all duration-200">
      </i>
      <span x-text="$store.i18n.t('edu_cert_btn')"></span>
    </button>
  </template>

  <!-- External link — portal: teal, ícone translada diagonal -->
  <div class="flex-1 min-w-0"></div>
  <a :href="item.url" target="_blank" rel="noopener noreferrer" @click.stop
     class="group/ext flex items-center justify-center w-8 h-8 bg-black/40
            border border-teal-500/15
            hover:border-teal-400/60 hover:bg-teal-950/35
            hover:shadow-[0_0_14px_rgba(167,139,250,0.2)]
            transition-all duration-200">
    <i data-lucide="external-link"
       class="w-3.5 h-3.5 text-teal-400/35
              group-hover/ext:text-teal-300
              group-hover/ext:translate-x-[2px] group-hover/ext:-translate-y-[2px]
              group-hover/ext:drop-shadow-[0_0_4px_rgba(167,139,250,0.6)]
              transition-all duration-200">
    </i>
  </a>

</div>
                  </div>
                  <!-- ── END ITEM EXPANDED PANEL ── -->

                </div>

              </template>
            </div>
            <!-- END ITEM LOOP -->

          </div>
          <!-- ── END SECTION BODY ─────────────────────────── -->

        </div>
        <!-- ══ END SECTION WRAPPER ══ -->

      </template>

    </div>

    <!-- ══ FOOTER ══════════════════════════════ -->
    <div class="relative flex items-center justify-between px-5 py-2.5 border-t border-white/20 bg-black/40">
      <div class="flex items-center gap-2">
        <div class="flex gap-1">
          <div class="w-1 h-1.5 bg-primary/20"></div>
          <div class="w-1 h-1.5 bg-primary/50"></div>
          <div class="w-1 h-1.5 bg-primary animate-pulse"></div>
        </div>
        <span class="text-[length:var(--text-xs)] text-primary/40 uppercase tracking-[0.1em]"
              x-text="$store.i18n.t('edu_status_verified')"></span>
      </div>
    </div>

    <div class="absolute bottom-0 right-0 w-6 h-6 bg-primary/15 pointer-events-none"
         style="clip-path:polygon(100% 0,100% 100%,0 100%)"></div>

  </div><!-- /.outer frame -->


  <!-- ══════════════════════════════════════════
    PDF CERT MODAL
  ══════════════════════════════════════════════ -->
  <div x-show="certModal.open"
       x-transition:enter="transition duration-300 ease-out"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition duration-200 ease-in"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-95"
       class="fixed inset-0 z-[12000] flex items-center justify-center p-4"
       style="backdrop-filter:blur(8px); background:rgba(0,0,0,0.88)">

    <div id="cert-modal-box"
         class="relative w-full max-w-3xl max-h-[90vh] flex flex-col bg-black border-primary/40
                shadow-[0_0_60px_rgba(var(--color-primary-rgb),0.2)]"
         style="clip-path:polygon(0 0,100% 0,100% 98%,98% 100%,0 100%)">

      <!-- Modal top accent -->
      <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-primary to-transparent opacity-70"></div>

      <!-- Modal header -->
      <div class="flex-shrink-0 flex items-center justify-between px-4 py-3
                  border-b border-primary/20 bg-primary/5">
        <div class="flex items-center gap-2.5">
          <div class="w-1.5 h-1.5 bg-primary rotate-45 shadow-[0_0_6px_var(--color-primary)] animate-pulse"></div>
          <span class="text-[length:var(--text-sm)] font-black uppercase tracking-[0.1em] text-primary"
                x-text="$store.i18n.t('edu_cert_viewer')"></span>
          <span class="text-[length:var(--text-xs)] text-primary/40 uppercase tracking-[0.1em] hidden sm:block"
                x-text="certModal.file">
          </span>
        </div>

        <div class="flex items-center gap-2">

          <!-- Page nav -->
          <template x-if="certModal.total > 1">
            <div class="flex items-center gap-1.5">
              <button @click="prevPage()"
                      :disabled="certModal.page <= 1"
                      class="w-6 h-6 flex items-center justify-center border-primary/25 bg-black/60
                             text-primary/60 hover:text-primary hover:border-primary
                             disabled:opacity-20 disabled:cursor-not-allowed transition-all">
                <i data-lucide="chevron-left" class="w-3 h-3"></i>
              </button>
              <span class="text-[length:var(--text-xs)] text-primary/50 font-black tracking-[0.1em] px-1"
                    x-text="certModal.page + ' / ' + certModal.total"></span>
              <button @click="nextPage()"
                      :disabled="certModal.page >= certModal.total"
                      class="w-6 h-6 flex items-center justify-center border-primary/25 bg-black/60
                             text-primary/60 hover:text-primary hover:border-primary
                             disabled:opacity-20 disabled:cursor-not-allowed transition-all">
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </button>
            </div>
          </template>

          <!-- Fullscreen toggle -->
          <button @click="toggleFullscreen()"
                  class="w-7 h-7 flex items-center justify-center bg-primary/8
                         text-primary/40 hover:text-primary hover:bg-primary/18
                         hover:shadow-[0_0_10px_rgba(var(--color-primary-rgb),0.2)]
                         transition-all duration-200"
                  style="clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%)"
                  :title="certModal.fullscreen
                    ? $store.i18n.t('edu_fullscreen_exit')
                    : $store.i18n.t('edu_fullscreen_enter')">
            <i :data-lucide="certModal.fullscreen ? 'minimize-2' : 'maximize-2'" class="w-3.5 h-3.5"></i>
          </button>

          <!-- Close -->
          <button @click="closeCert()"
                  class="w-7 h-7 flex items-center justify-center bg-primary/8
                         text-primary/35 hover:text-primary hover:bg-primary/18
                         hover:shadow-[0_0_10px_rgba(var(--color-primary-rgb),0.2)]
                         transition-all duration-200"
                  style="clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%)">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>

        </div>
      </div>

      <!-- Canvas area -->
      <div class="flex-1 overflow-auto flex items-start justify-center p-4 relative" style="min-height:0">

        <!-- Loading spinner -->
        <div x-show="certModal.loading"
             class="absolute inset-0 flex items-center justify-center gap-2 bg-black/60 z-10">
          <div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce [animation-delay:0ms]"></div>
          <div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce [animation-delay:150ms]"></div>
          <div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce [animation-delay:300ms]"></div>
          <span class="text-[10px] text-primary/50 uppercase tracking-[0.1em] ml-1"
                x-text="$store.i18n.t('edu_cert_loading')"></span>
        </div>

        <canvas id="cert-canvas"
                class="max-w-full shadow-[0_0_30px_rgba(0,0,0,0.8)]"
                style="display:block"></canvas>
      </div>

      <!-- Modal footer -->
      <div class="flex-shrink-0 flex items-center justify-between px-4 py-2
                  border-t border-primary/10 bg-black/40">
        <span class="text-[length:var(--text-xs)] text-primary/30 uppercase tracking-[0.1em] animate-pulse"
              x-text="$store.i18n.t('edu_cert_esc')"></span>
        <div class="flex gap-1">
          <div class="w-1 h-1.5 bg-primary/20"></div>
          <div class="w-1 h-1.5 bg-primary/50"></div>
