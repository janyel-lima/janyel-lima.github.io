<!-- ═══════════════════════════════════════════════════════════
  tetris.html — fragmento incluído dinamicamente
  Features: blocos coloridos, hold, ghost, combo, ranking JSON
══════════════════════════════════════════════════════════════ -->

<div id="tetris-root" class="w-full p-4">
  <div class="w-full flex flex-col lg:flex-row gap-4 items-start justify-center">

    <!-- ── Coluna esquerda: Hold + Stats ───────────────────── -->
    <div class="flex flex-col gap-3 w-full lg:w-36 shrink-0">

      <!-- Hold -->
      <div class="border border-primary/30 bg-black/60 p-3 text-center">
        <p class="text-[length:var(--text-micro)] text-primary/50 uppercase tracking-widest mb-2">// hold</p>
        <canvas id="tetris-hold" width="80" height="80" class="mx-auto block" style="background:transparent"></canvas>
        <p id="tetris-hold-lock" class="text-[length:var(--text-micro)] text-red-500/60 uppercase tracking-widest mt-1 hidden">locked</p>
      </div>

      <!-- Stats -->
      <div class="border border-white/5 bg-black/40 p-3 space-y-3">
        <div>
          <p class="text-[length:var(--text-micro)] text-gray-600 uppercase tracking-widest">// nível</p>
          <p id="tetris-level" class="text-lg font-black text-primary tracking-widest">1</p>
        </div>
        <div>
          <p class="text-[length:var(--text-micro)] text-gray-600 uppercase tracking-widest">// linhas</p>
          <p id="tetris-lines" class="text-lg font-black text-white/80 tracking-widest">0</p>
        </div>
        <div>
          <p class="text-[length:var(--text-micro)] text-gray-600 uppercase tracking-widest">// combo</p>
          <p id="tetris-combo" class="text-lg font-black text-accent tracking-widest">0x</p>
        </div>
      </div>

      <!-- Speed bar -->
      <div class="border border-white/5 bg-black/40 p-3">
        <p class="text-[length:var(--text-micro)] text-gray-600 uppercase tracking-widest mb-1">// spd</p>
        <div class="h-1 bg-black border border-white/5">
          <div id="tetris-speed-bar"
               class="h-full bg-primary transition-all duration-500 shadow-[0_0_6px_var(--color-primary)]"
               style="width:5%"></div>
        </div>
      </div>

      <!-- Botões -->
      <div class="flex flex-col gap-2">
        <button id="tetris-pause-btn" disabled
          class="py-2 px-3 border border-primary/30 bg-black/60 text-primary
                 text-[length:var(--text-micro)] uppercase tracking-widest
                 hover:border-primary hover:bg-primary/10 transition-all duration-200
                 disabled:opacity-30 disabled:cursor-not-allowed">
          [ PAUSAR ]
        </button>
        <button id="tetris-restart-btn" disabled
          class="py-2 px-3 border border-white/10 bg-black/60 text-gray-400
                 text-[length:var(--text-micro)] uppercase tracking-widest
                 hover:border-white/30 hover:text-white transition-all duration-200
                 disabled:opacity-30 disabled:cursor-not-allowed">
          [ REINICIAR ]
        </button>
      </div>

    </div>

    <!-- ── Canvas central ──────────────────────────────────── -->
    <div class="relative mx-auto lg:mx-0 shrink-0">
      <div class="absolute -inset-2 bg-primary/5 blur-xl pointer-events-none"></div>
      <div class="relative border border-primary/40 shadow-[0_0_30px_rgba(var(--color-primary-rgb),0.15)]">
        <canvas id="tetris-canvas" width="240" height="480" class="block" style="background:#070714"></canvas>
        <div class="absolute inset-0 bg-scanlines opacity-5 pointer-events-none"></div>
      </div>

      <!-- Feedback flutuante -->
      <div id="tetris-feedback"
           class="absolute top-4 left-0 right-0 flex justify-center pointer-events-none"
           style="opacity:0; transition: opacity 0.3s">
        <span id="tetris-feedback-text"
              class="text-[length:var(--text-md)] font-black uppercase tracking-widest text-primary
                     drop-shadow-[0_0_12px_rgba(var(--color-primary-rgb),1)]"></span>
      </div>

      <!-- Start / Game Over -->
      <div id="tetris-start-screen"
           class="absolute inset-0 bg-black/92 flex flex-col items-center justify-center p-4 text-center"
           style="backdrop-filter:blur(2px)">
        <div class="w-2 h-2 bg-primary rotate-45 shadow-[0_0_8px_var(--color-primary)] mb-3"></div>
        <h3 class="text-[length:var(--text-lg)] font-black uppercase tracking-[0.1em] text-primary mb-1">TETRIS.exe</h3>
        <p class="text-[length:var(--text-micro)] text-primary/50 uppercase tracking-widest mb-4">// módulo_de_desafio_ativo</p>

        <div class="w-full bg-black/60 border border-white/5 p-3 mb-4 text-left
                    text-[length:var(--text-micro)] text-gray-400 uppercase tracking-widest space-y-1">
          <p class="text-primary/60 mb-2">// controles</p>
          <p><span class="text-primary">← →</span>&nbsp; mover</p>
          <p><span class="text-primary">↑ / Z</span>&nbsp; rotacionar ↻</p>
          <p><span class="text-primary">X</span>&nbsp;&nbsp;&nbsp;&nbsp; rotacionar ↺</p>
          <p><span class="text-primary">↓</span>&nbsp;&nbsp;&nbsp;&nbsp; acelerar</p>
          <p><span class="text-primary">SPC</span>&nbsp; queda rápida</p>
          <p><span class="text-primary">C</span>&nbsp;&nbsp;&nbsp;&nbsp; hold</p>
          <p><span class="text-primary">P</span>&nbsp;&nbsp;&nbsp;&nbsp; pausar</p>
        </div>

        <button id="tetris-start-btn"
          class="w-full py-3 px-4 border border-primary/60 bg-primary/10
                 hover:bg-primary/20 hover:border-primary text-primary font-black
                 uppercase tracking-widest text-[length:var(--text-sm)]
                 transition-all duration-200 flex items-center justify-center gap-2">
          <span>[ INICIAR ]</span><span class="animate-pulse">█</span>
        </button>

        <p id="tetris-gameover-text"
           class="text-red-500 text-[length:var(--text-md)] font-black uppercase tracking-widest mt-3 hidden">
          GAME_OVER
        </p>
      </div>
    </div>

    <!-- ── Coluna direita: Score + Next + Ranking ──────────── -->
    <div class="flex flex-col gap-3 w-full lg:w-36 shrink-0">

      <!-- Score -->
      <div class="border border-primary/30 bg-black/60 p-3 text-center
                  shadow-[0_0_15px_rgba(var(--color-primary-rgb),0.1)]">
        <p class="text-[length:var(--text-micro)] text-primary/50 uppercase tracking-widest mb-1">// score</p>
        <p id="tetris-score"
           class="text-2xl font-black text-primary tracking-widest
                  drop-shadow-[0_0_10px_rgba(var(--color-primary-rgb),0.8)]">0</p>
        <p class="text-[length:var(--text-micro)] text-gray-600 uppercase tracking-widest mt-1">melhor</p>
        <p id="tetris-best" class="text-sm font-black text-white/50 tracking-widest">0</p>
      </div>

      <!-- Next -->
      <div class="border border-primary/30 bg-black/60 p-3 text-center">
        <p class="text-[length:var(--text-micro)] text-primary/50 uppercase tracking-widest mb-2">// next</p>
        <canvas id="tetris-next" width="80" height="80" class="mx-auto block" style="background:transparent"></canvas>
      </div>

      <!-- Ranking -->
      <div class="border border-primary/20 bg-black/60 p-3">
        <div class="flex items-center justify-between mb-2">
          <p class="text-[length:var(--text-micro)] text-primary/50 uppercase tracking-widest">// ranking</p>
          <button id="tetris-clear-rank"
                  class="text-[length:var(--text-micro)] text-red-500/40 hover:text-red-500 transition uppercase tracking-widest">
            [clr]
          </button>
        </div>
        <div id="tetris-ranking-list" class="space-y-1 max-h-48 overflow-y-auto">
          <!-- JS preenche -->
        </div>
      </div>

      <!-- Mobile controls -->
      <div class="lg:hidden border border-white/5 bg-black/40 p-3">
        <p class="text-[length:var(--text-micro)] text-gray-600 uppercase tracking-widest mb-2">// touch</p>
        <div class="grid grid-cols-3 gap-1 mb-1">
          <div></div>
          <button id="t-up"   class="tetris-mb-btn">↑</button>
          <button id="t-hold" class="tetris-mb-btn text-accent">C</button>
          <button id="t-left" class="tetris-mb-btn">←</button>
          <button id="t-down" class="tetris-mb-btn">↓</button>
          <button id="t-right"class="tetris-mb-btn">→</button>
        </div>
        <button id="t-drop" class="tetris-mb-btn w-full">SPC</button>
      </div>

    </div>
  </div>
</div>

<style>
  .tetris-mb-btn {
    padding: 0.4rem;
    border: 1px solid rgba(var(--color-primary-rgb), 0.25);
    background: rgba(0,0,0,0.6);
    color: rgba(var(--color-primary-rgb), 0.8);
    font-size: 0.65rem;
    font-family: monospace;
    transition: all 0.1s;
    width: 100%;
  }
  .tetris-mb-btn:active {
    background: rgba(var(--color-primary-rgb), 0.15);
    border-color: rgba(var(--color-primary-rgb), 0.9);
  }
  #tetris-ranking-list::-webkit-scrollbar { width: 2px; }
  #tetris-ranking-list::-webkit-scrollbar-track { background: transparent; }
  #tetris-ranking-list::-webkit-scrollbar-thumb { background: rgba(var(--color-primary-rgb), 0.3); }
</style>

<script>
(function () {

  // ══════════════════════════════════════════════════════
  // CONSTANTS
  // ══════════════════════════════════════════════════════

  const COLS        = 10;
  const ROWS        = 20;
  const BLOCK       = 24;
  const MINI        = 20;
  const STORAGE_KEY = 'tetris-rankings';
  const MAX_RANK    = 10;

  // Blocos coloridos (emoji de quadrado do teclado emoji)
  const PIECES = [
    { id:'I', shape:[[1,1,1,1]],           block:'🟦' },
    { id:'O', shape:[[1,1],[1,1]],          block:'🟨' },
    { id:'T', shape:[[0,1,0],[1,1,1]],      block:'🟪' },
    { id:'J', shape:[[1,0,0],[1,1,1]],      block:'🟧' },
    { id:'L', shape:[[0,0,1],[1,1,1]],      block:'🟫' },
    { id:'S', shape:[[0,1,1],[1,1,0]],      block:'🟩' },
    { id:'Z', shape:[[1,1,0],[0,1,1]],      block:'🟥' },
  ];

  // Pontuação Guideline
  const LINE_PTS    = [0, 100, 300, 500, 800];
  const COMBO_BONUS = 50;
  const SOFT_PTS    = 1;
  const HARD_PTS    = 2;

  // ══════════════════════════════════════════════════════
  // DOM
  // ══════════════════════════════════════════════════════

  const canvas      = document.getElementById('tetris-canvas');
  const holdCanvas  = document.getElementById('tetris-hold');
  const nextCanvas  = document.getElementById('tetris-next');
  const scoreEl     = document.getElementById('tetris-score');
  const bestEl      = document.getElementById('tetris-best');
  const levelEl     = document.getElementById('tetris-level');
  const linesEl     = document.getElementById('tetris-lines');
  const comboEl     = document.getElementById('tetris-combo');
  const speedBar    = document.getElementById('tetris-speed-bar');
  const startScreen = document.getElementById('tetris-start-screen');
  const startBtn    = document.getElementById('tetris-start-btn');
  const pauseBtn    = document.getElementById('tetris-pause-btn');
  const restartBtn  = document.getElementById('tetris-restart-btn');
  const gameOverEl  = document.getElementById('tetris-gameover-text');
  const holdLockEl  = document.getElementById('tetris-hold-lock');
  const feedbackEl  = document.getElementById('tetris-feedback');
  const feedbackTxt = document.getElementById('tetris-feedback-text');
  const rankingList = document.getElementById('tetris-ranking-list');
  const clearRankBtn= document.getElementById('tetris-clear-rank');

  if (!canvas) return;

  const ctx     = canvas.getContext('2d');
  const holdCtx = holdCanvas.getContext('2d');
  const nextCtx = nextCanvas.getContext('2d');

  // ══════════════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════════════

  let board, current, nextPiece, holdPiece;
  let score, lines, level, combo, isHoldLocked;
  let isPaused, isOver;
  let dropCounter, dropInterval, lastTime, raf;
  let feedbackTimer;

  const PLAYER = 'RECRUTA';

  // ══════════════════════════════════════════════════════
  // RANKING
  // ══════════════════════════════════════════════════════

  function loadRanking() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }

  function saveRanking(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function submitScore(name, pts, lvl) {
    let list = loadRanking();
    const idx = list.findIndex(e => e.name === name);

    if (idx >= 0) {
      // Atualiza apenas se for maior — sem duplicar
      if (pts > list[idx].score) {
        list[idx] = { name, score: pts, level: lvl, date: today() };
      }
    } else {
      list.push({ name, score: pts, level: lvl, date: today() });
    }

    list.sort((a, b) => b.score - a.score);
    list = list.slice(0, MAX_RANK);
    saveRanking(list);
    renderRanking();
    return list.findIndex(e => e.name === name) + 1; // posição 1-based
  }

  function today() {
    return new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
  }

  function getBest(name) {
    return loadRanking().find(e => e.name === name)?.score ?? 0;
  }

  function renderRanking() {
    if (!rankingList) return;
    const list = loadRanking();
    if (!list.length) {
      rankingList.innerHTML = `<p class="text-[length:var(--text-micro)] text-gray-700 uppercase tracking-widest text-center py-2">sem registros</p>`;
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    rankingList.innerHTML = list.map((e, i) => `
      <div class="flex items-center justify-between py-1 border-b border-white/5 last:border-0 gap-1">
        <div class="flex items-center gap-1 min-w-0">
          <span class="text-[0.6rem] shrink-0">${medals[i] ?? `${i+1}.`}</span>
          <span class="text-[length:var(--text-micro)] uppercase tracking-widest truncate ${i===0?'text-primary font-black':'text-gray-400'}">
            ${e.name}
          </span>
        </div>
        <span class="text-[length:var(--text-micro)] font-black shrink-0 ${i===0?'text-primary':'text-white/50'}">
          ${e.score.toLocaleString()}
        </span>
      </div>`).join('');
  }

  // ══════════════════════════════════════════════════════
  // HELPERS
  // ══════════════════════════════════════════════════════

  function sfx(name) { try { window.Alpine?.store('sfx')?.play(name); } catch (_) {} }

  function createBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function clonePiece(p) {
    return { ...p, shape: p.shape.map(r => [...r]) };
  }

  function randomPiece() {
    const p = PIECES[Math.floor(Math.random() * PIECES.length)];
    return {
      ...clonePiece(p),
      x: Math.floor(COLS / 2) - Math.floor(p.shape[0].length / 2),
      y: 0,
    };
  }

  function getDropInterval(lvl) {
    // Tetris Guideline: ~833ms * 0.8^(lvl-1), mínimo 80ms
    return Math.max(80, Math.round(1000 * Math.pow(0.82, lvl - 1)));
  }

  function showFeedback(text) {
    if (!feedbackEl || !feedbackTxt) return;
    feedbackTxt.textContent = text;
    feedbackEl.style.opacity = '1';
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => { feedbackEl.style.opacity = '0'; }, 1000);
  }

  // ══════════════════════════════════════════════════════
  // DRAW
  // ══════════════════════════════════════════════════════

  function drawBlock(c, x, y, emoji, size, ox = 0, oy = 0, alpha = 1) {
    c.save();
    c.globalAlpha  = alpha;
    c.font         = `${size * 0.85}px sans-serif`;
    c.textAlign    = 'center';
    c.textBaseline = 'middle';
    c.fillText(emoji, ox + x * size + size / 2, oy + y * size + size / 2);
    c.restore();
  }

  function drawMini(c, piece, cw, ch, size = MINI) {
    c.clearRect(0, 0, cw, ch);
    if (!piece) return;
    const s  = piece.shape;
    const ox = (cw - s[0].length * size) / 2;
    const oy = (ch - s.length    * size) / 2;
    s.forEach((row, y) => row.forEach((v, x) => {
      if (v) drawBlock(c, x, y, piece.block, size, ox, oy);
    }));
  }

  function draw() {
    // Fundo
    ctx.fillStyle = '#070714';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grade sutil
    ctx.strokeStyle = 'rgba(8,196,202,0.04)';
    ctx.lineWidth   = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*BLOCK,0); ctx.lineTo(x*BLOCK, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y*BLOCK); ctx.lineTo(canvas.width, y*BLOCK); ctx.stroke();
    }

    // Tabuleiro fixo
    board.forEach((row, y) => row.forEach((cell, x) => {
      if (cell) drawBlock(ctx, x, y, cell, BLOCK);
    }));

    // Ghost piece
    if (current) {
      let gy = current.y;
      while (!collides({ ...current, y: gy + 1 })) gy++;
      if (gy !== current.y) {
        current.shape.forEach((row, dy) => row.forEach((v, dx) => {
          if (v) drawBlock(ctx, current.x+dx, gy+dy, current.block, BLOCK, 0, 0, 0.15);
        }));
      }
      // Peça atual
      current.shape.forEach((row, dy) => row.forEach((v, dx) => {
        if (v) drawBlock(ctx, current.x+dx, current.y+dy, current.block, BLOCK);
      }));
    }

    // Mini telas
    drawMini(nextCtx, nextPiece, nextCanvas.width, nextCanvas.height);
    drawMini(holdCtx, holdPiece, holdCanvas.width, holdCanvas.height);

    // HUD
    if (scoreEl) scoreEl.textContent = score.toLocaleString();
    if (levelEl) levelEl.textContent = level;
    if (linesEl) linesEl.textContent = lines;
    if (comboEl) comboEl.textContent = combo > 0 ? `${combo}x` : '0x';
    if (bestEl)  bestEl.textContent  = Math.max(getBest(PLAYER), score).toLocaleString();
    if (speedBar) {
      const pct = Math.min(100, Math.round((1 - (dropInterval - 80) / 920) * 100));
      speedBar.style.width = `${Math.max(5, pct)}%`;
    }
  }

  // ══════════════════════════════════════════════════════
  // COLLISION
  // ══════════════════════════════════════════════════════

  function collides(piece) {
    return piece.shape.some((row, dy) =>
      row.some((v, dx) => {
        if (!v) return false;
        const nx = piece.x + dx, ny = piece.y + dy;
        return nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && board[ny]?.[nx]);
      })
    );
  }

  // ══════════════════════════════════════════════════════
  // MECHANICS
  // ══════════════════════════════════════════════════════

  function solidify() {
    current.shape.forEach((row, dy) => row.forEach((v, dx) => {
      if (v) board[current.y + dy][current.x + dx] = current.block;
    }));
    sfx('click');
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(Boolean)) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));
        y++;
        cleared++;
      }
    }

    if (!cleared) { combo = 0; return; }

    combo++;
    lines += cleared;

    // Level up a cada 10 linhas
    const newLevel = Math.floor(lines / 10) + 1;
    if (newLevel > level) {
      level        = newLevel;
      dropInterval = getDropInterval(level);
      showFeedback(`▲ LEVEL ${level}`);
      sfx('select');
    }

    // Score
    const base   = (LINE_PTS[cleared] ?? 800) * level;
    const comboB = combo > 1 ? COMBO_BONUS * (combo - 1) * level : 0;
    score += base + comboB;

    // Feedback
    const labels = ['','SINGLE','DOUBLE','TRIPLE','TETRIS!!!'];
    const msg    = combo > 1
      ? `${cleared === 4 ? 'TETRIS!!!' : labels[cleared]} ${combo}x COMBO`
      : (cleared === 4 ? '✦ TETRIS !!!' : labels[cleared]);
    showFeedback(msg);

    sfx(cleared === 4 ? 'select' : 'hover');
  }

  function spawnNext() {
    current      = nextPiece;
    nextPiece    = randomPiece();
    isHoldLocked = false;
    holdLockEl?.classList.add('hidden');
    dropCounter  = 0;
    if (collides(current)) gameOver();
  }

  function drop(soft = false) {
    current.y++;
    if (collides(current)) {
      current.y--;
      solidify();
      clearLines();
      spawnNext();
    } else {
      if (soft) score += SOFT_PTS;
      dropCounter = 0;
    }
  }

  function hardDrop() {
    let dropped = 0;
    while (!collides({ ...current, y: current.y + 1 })) { current.y++; dropped++; }
    score += dropped * HARD_PTS;
    drop();
  }

  function rotate(dir = 1) {
    const orig = current.shape;
    const R = orig.length, C = orig[0].length;
    const next = dir > 0
      ? Array.from({ length: C }, (_, c) => Array.from({ length: R }, (__, r) => orig[R-1-r][c]))
      : Array.from({ length: C }, (_, c) => Array.from({ length: R }, (__, r) => orig[r][C-1-c]));

    current.shape = next;

    // Wall kick: testa offsets
    for (const off of [0, -1, 1, -2, 2]) {
      current.x += off;
      if (!collides(current)) { sfx('hover'); return; }
      current.x -= off;
    }
    current.shape = orig; // revert
  }

  function holdAction() {
    if (isHoldLocked) return;
    const base = PIECES.find(p => p.id === current.id);

    if (!holdPiece) {
      holdPiece = clonePiece(base);
      spawnNext();
    } else {
      const prevHold = clonePiece(PIECES.find(p => p.id === holdPiece.id));
      holdPiece = clonePiece(base);
      current   = {
        ...clonePiece(prevHold),
        x: Math.floor(COLS / 2) - Math.floor(prevHold.shape[0].length / 2),
        y: 0,
      };
    }

    isHoldLocked = true;
    holdLockEl?.classList.remove('hidden');
    dropCounter = 0;
    sfx('click');
  }

  function gameOver() {
    isOver = true;
    cancelAnimationFrame(raf);
    const pos = submitScore(PLAYER, score, level);
    startScreen.style.display  = 'flex';
    gameOverEl.classList.remove('hidden');
    gameOverEl.textContent     = `GAME_OVER — rank #${pos}`;
    startBtn.textContent       = '[ REINICIAR ]';
    pauseBtn.disabled          = true;
    sfx('close');
  }

  // ══════════════════════════════════════════════════════
  // LOOP
  // ══════════════════════════════════════════════════════

  function loop(time = 0) {
    if (isOver || isPaused) return;
    const dt = time - lastTime;
    lastTime = time;
    dropCounter += dt;
    if (dropCounter > dropInterval) drop();
    draw();
    raf = requestAnimationFrame(loop);
  }

  // ══════════════════════════════════════════════════════
  // RESET
  // ══════════════════════════════════════════════════════

  function reset() {
    cancelAnimationFrame(raf);
    board        = createBoard();
    score = lines = combo = 0;
    level        = 1;
    isPaused = isOver = isHoldLocked = false;
    holdPiece    = null;
    dropInterval = getDropInterval(1);
    dropCounter  = 0;
    lastTime     = 0;

    holdLockEl?.classList.add('hidden');
    nextPiece = randomPiece();
    spawnNext();

    startScreen.style.display = 'none';
    gameOverEl.classList.add('hidden');
    gameOverEl.textContent = 'GAME_OVER';
    startBtn.textContent   = '[ INICIAR ]';
    pauseBtn.disabled      = false;
    restartBtn.disabled    = false;
    pauseBtn.textContent   = '[ PAUSAR ]';

    sfx('click');
    raf = requestAnimationFrame(loop);
  }

  function togglePause() {
    if (isOver) return;
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? '[ RETOMAR ]' : '[ PAUSAR ]';
    if (!isPaused) { lastTime = 0; raf = requestAnimationFrame(loop); }
    sfx('click');
  }

  // ══════════════════════════════════════════════════════
  // INPUT — Teclado
  // ══════════════════════════════════════════════════════

  function onKey(e) {
    if (isOver) return;
    if (isPaused && !['p','P'].includes(e.key)) return;

    switch (e.key) {
      case 'ArrowLeft':  current.x--; if (collides(current)) current.x++; break;
      case 'ArrowRight': current.x++; if (collides(current)) current.x--; break;
      case 'ArrowDown':  drop(true); break;
      case 'ArrowUp':
      case 'z': case 'Z': rotate(1); break;
      case 'x': case 'X': rotate(-1); break;
      case ' ':            e.preventDefault(); hardDrop(); break;
      case 'c': case 'C':  holdAction(); break;
      case 'p': case 'P':  togglePause(); break;
    }
  }

  document.addEventListener('keydown', onKey);

  // Mobile buttons
  const mobileMap = {
    't-left':  () => { current.x--; if (collides(current)) current.x++; },
    't-right': () => { current.x++; if (collides(current)) current.x--; },
    't-up':    () => rotate(1),
    't-down':  () => drop(true),
    't-drop':  () => hardDrop(),
    't-hold':  () => holdAction(),
  };
  Object.entries(mobileMap).forEach(([id, fn]) => {
    document.getElementById(id)?.addEventListener('click', fn);
  });

  // Swipe no canvas
  let swX = 0, swY = 0;
  canvas.addEventListener('touchstart', e => { swX = e.touches[0].clientX; swY = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - swX;
    const dy = e.changedTouches[0].clientY - swY;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 10) { rotate(1); return; }
    if (ax > ay) { dx > 0 ? (current.x++, collides(current) && current.x--) : (current.x--, collides(current) && current.x++); }
    else if (dy > 0) hardDrop();
  }, { passive: true });

  // Buttons
  startBtn.addEventListener('click',   reset);
  pauseBtn.addEventListener('click',   togglePause);
  restartBtn.addEventListener('click', reset);
  clearRankBtn?.addEventListener('click', () => {
    if (confirm('Limpar todo o ranking?')) {
      localStorage.removeItem(STORAGE_KEY);
      renderRanking();
      if (bestEl) bestEl.textContent = '0';
    }
  });

  // ══════════════════════════════════════════════════════
  // CLEANUP ao fechar o modal
  // ══════════════════════════════════════════════════════

  const _obs = new MutationObserver(() => {
    if (!document.body.contains(canvas)) {
      cancelAnimationFrame(raf);
      document.removeEventListener('keydown', onKey);
      _obs.disconnect();
    }
  });
  _obs.observe(document.body, { childList: true, subtree: true });

  // ══════════════════════════════════════════════════════
  // BOOT
  // ══════════════════════════════════════════════════════

  renderRanking();
  if (bestEl) bestEl.textContent = getBest(PLAYER).toLocaleString();
  drawMini(nextCtx, null, nextCanvas.width, nextCanvas.height);
  drawMini(holdCtx, null, holdCanvas.width, holdCanvas.height);

})();
</script>
